<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FinMatch AI</title>
<style>
  :root {
    --bg: #f6f7f9;
    --card: #ffffff;
    --text: #1f2933;
    --muted: #616e7c;
    --border: #d9dee4;
    --accent: #2f5fd0;
    --ok-bg: #e3f4e8;   --ok-fg: #1d6b3a;
    --warn-bg: #fff3d6; --warn-fg: #8a5a00;
    --bad-bg: #fde4e1;  --bad-fg: #a1281c;
    --info-bg: #e4ecfb; --info-fg: #234a9b;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14181d;
      --card: #1d232b;
      --text: #e6eaee;
      --muted: #9aa5b1;
      --border: #333c47;
      --accent: #7aa2ff;
      --ok-bg: #1b3a27;   --ok-fg: #8fdcaa;
      --warn-bg: #433512; --warn-fg: #f2cf7a;
      --bad-bg: #4a2420;  --bad-fg: #ffa59c;
      --info-bg: #1f2e52; --info-fg: #a9c2ff;
    }
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; padding: 24px 16px 48px;
    background: var(--bg); color: var(--text);
    font-family: "Malgun Gothic", "Apple SD Gothic Neo", system-ui, sans-serif;
    line-height: 1.5;
  }
  main { max-width: 1100px; margin: 0 auto; }
  h1 { margin: 0 0 4px; font-size: 24px; }
  .sub { margin: 0 0 20px; color: var(--muted); }
  .card {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; padding: 16px; margin-bottom: 16px;
  }
  .uploads { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; }
  label { display: block; font-weight: 600; margin-bottom: 6px; }
  input[type=file] { width: 100%; }
  button {
    margin-top: 14px; padding: 10px 20px; font-size: 15px; font-weight: 600;
    background: var(--accent); color: #fff; border: 0; border-radius: 8px; cursor: pointer;
  }
  button:disabled { opacity: .55; cursor: default; }
  #message { margin-top: 12px; }
  .error {
    padding: 10px 12px; border-radius: 8px;
    background: var(--bad-bg); color: var(--bad-fg);
  }
  .notice { color: var(--muted); font-size: 14px; margin: 8px 0 0; }
  .summary { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 12px; }
  .chip {
    border: 1px solid var(--border); background: var(--card); color: var(--text);
    border-radius: 999px; padding: 6px 14px; font-size: 14px; margin: 0; cursor: pointer;
    font-weight: 500;
  }
  .chip[aria-pressed=true] { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
  .table-wrap { overflow-x: auto; margin-top: 12px; }
  table { border-collapse: collapse; width: 100%; font-size: 14px; }
  th, td { padding: 8px 10px; border-bottom: 1px solid var(--border); text-align: left; white-space: nowrap; }
  th { color: var(--muted); font-weight: 600; }
  td.num, th.num { text-align: right; }
  td.reason { white-space: normal; min-width: 220px; }
  .badge { display: inline-block; padding: 2px 10px; border-radius: 999px; font-size: 13px; font-weight: 600; }
  .b-ok   { background: var(--ok-bg);   color: var(--ok-fg); }
  .b-warn { background: var(--warn-bg); color: var(--warn-fg); }
  .b-bad  { background: var(--bad-bg);  color: var(--bad-fg); }
  .b-info { background: var(--info-bg); color: var(--info-fg); }
  .diff { font-weight: 700; color: var(--bad-fg); }
  .empty { color: var(--muted); padding: 20px 0; text-align: center; }
  [hidden] { display: none !important; }
  @media (max-width: 640px) { .uploads { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<main>
  <h1>FinMatch AI</h1>
  <p class="sub">은행 거래내역과 학생회 지출 장부를 비교해 확인이 필요한 항목을 찾습니다.</p>

  <form id="form" class="card">
    <div class="uploads">
      <div>
        <label for="bankFile">은행 거래내역 (.xlsx)</label>
        <input type="file" id="bankFile" accept=".xlsx" required>
      </div>
      <div>
        <label for="ledgerFile">학생회 지출 장부 (.xlsx)</label>
        <input type="file" id="ledgerFile" accept=".xlsx" required>
      </div>
    </div>
    <button type="submit" id="submit">비교하기</button>
    <div id="message" role="status" aria-live="polite"></div>
  </form>

  <section id="result" class="card" hidden>
    <h2 style="margin:0 0 4px;font-size:18px">비교 결과</h2>
    <div id="counts" class="sub" style="margin:0"></div>
    <div id="summary" class="summary"></div>
    <p class="notice">표시된 항목은 오류로 확정된 것이 아니라 <strong>담당자가 확인해야 할 의심 항목</strong>입니다.</p>
    <div class="table-wrap">
      <table>
        <thead>
          <tr>
            <th>판정</th><th>은행 번호</th><th>은행 일시</th><th>은행 거래처</th><th class="num">은행 금액</th>
            <th>장부 번호</th><th>장부 거래처</th><th class="num">장부 금액</th><th>판단 이유</th>
          </tr>
        </thead>
        <tbody id="rows"></tbody>
      </table>
    </div>
    <div id="empty" class="empty" hidden>표시할 항목이 없습니다.</div>
  </section>
</main>

<script>
  var MATCHED = "일치";
  var allItems = [];
  var activeFilter = null;   // null이면 "일치가 아닌 항목 전체"

  var form = document.getElementById("form");
  var submitButton = document.getElementById("submit");
  var message = document.getElementById("message");
  var resultSection = document.getElementById("result");

  form.addEventListener("submit", function (event) {
    event.preventDefault();
    upload();
  });

  function showError(text) {
    message.innerHTML = "";
    var box = document.createElement("div");
    box.className = "error";
    box.textContent = text;
    message.appendChild(box);
  }

  async function upload() {
    var data = new FormData();
    data.append("bankFile", document.getElementById("bankFile").files[0]);
    data.append("ledgerFile", document.getElementById("ledgerFile").files[0]);

    message.textContent = "비교하는 중입니다...";
    submitButton.disabled = true;
    resultSection.hidden = true;

    try {
      var response = await fetch("/api/reconciliation", { method: "POST", body: data });
      var body = await response.json().catch(function () { return null; });

      if (!response.ok) {
        showError((body && body.error) ? body.error : "서버 오류가 발생했습니다. (" + response.status + ")");
        return;
      }
      message.textContent = "";
      render(body);
    } catch (e) {
      showError("서버에 연결할 수 없습니다. 서버가 켜져 있는지 확인해 주세요.");
    } finally {
      submitButton.disabled = false;
    }
  }

  function render(result) {
    allItems = result.items;
    activeFilter = null;

    document.getElementById("counts").textContent =
      "은행 행사 지출 " + result.bankExpenseCount + "건 · 장부 " + result.ledgerCount + "건";

    var summary = document.getElementById("summary");
    summary.innerHTML = "";
    summary.appendChild(makeChip("확인 필요 전체", null, countNonMatched()));
    Object.keys(result.summary).forEach(function (label) {
      summary.appendChild(makeChip(label, label, result.summary[label]));
    });

    resultSection.hidden = false;
    refreshTable();
  }

  function countNonMatched() {
    return allItems.filter(function (i) { return i.status !== MATCHED; }).length;
  }

  function makeChip(label, filter, count) {
    var chip = document.createElement("button");
    chip.type = "button";
    chip.className = "chip";
    chip.textContent = label + " " + count + "건";
    chip.dataset.filter = filter === null ? "" : filter;
    chip.setAttribute("aria-pressed", filter === activeFilter ? "true" : "false");
    chip.addEventListener("click", function () {
      activeFilter = filter;
      refreshTable();
    });
    return chip;
  }

  function refreshTable() {
    document.querySelectorAll("#summary .chip").forEach(function (chip) {
      var f = chip.dataset.filter === "" ? null : chip.dataset.filter;
      chip.setAttribute("aria-pressed", f === activeFilter ? "true" : "false");
    });

    var shown = allItems.filter(function (item) {
      return activeFilter === null ? item.status !== MATCHED : item.status === activeFilter;
    });

    var tbody = document.getElementById("rows");
    tbody.innerHTML = "";
    shown.forEach(function (item) { tbody.appendChild(makeRow(item)); });
    document.getElementById("empty").hidden = shown.length > 0;
  }

  function badgeClass(status) {
    if (status === MATCHED) return "b-ok";
    if (status.indexOf("표기") >= 0) return "b-info";
    if (status.indexOf("금액") >= 0 || status.indexOf("누락") >= 0 || status.indexOf("중복") >= 0) return "b-bad";
    return "b-warn";
  }

  function won(value) {
    return value === null || value === undefined ? "-" : Number(value).toLocaleString("ko-KR") + "원";
  }

  function text(value) {
    return value === null || value === undefined || value === "" ? "-" : value;
  }

  function makeRow(item) {
    var tr = document.createElement("tr");

    var badgeCell = document.createElement("td");
    var badge = document.createElement("span");
    badge.className = "badge " + badgeClass(item.status);
    badge.textContent = item.status;
    badgeCell.appendChild(badge);
    tr.appendChild(badgeCell);

    var amountsDiffer = item.bankAmount !== null && item.ledgerAmount !== null && item.bankAmount !== item.ledgerAmount;

    addCell(tr, text(item.bankId));
    addCell(tr, item.bankDateTime ? item.bankDateTime.replace("T", " ") : "-");
    addCell(tr, text(item.bankCounterparty));
    addCell(tr, won(item.bankAmount), "num", amountsDiffer);
    addCell(tr, item.ledgerIds && item.ledgerIds.length ? item.ledgerIds.join(", ") : "-");
    addCell(tr, text(item.ledgerCounterparty));
    addCell(tr, won(item.ledgerAmount), "num", amountsDiffer);
    addCell(tr, text(item.reason), "reason");
    return tr;
  }

  function addCell(tr, value, className, highlight) {
    var td = document.createElement("td");
    td.textContent = value;
    if (className) td.className = className;
    if (highlight) td.classList.add("diff");
    tr.appendChild(td);
  }
</script>
</body>
</html>
